
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Bad_Dos_Trenzinhos</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #090909;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .login {
      width: 100%;
      max-width: 390px;
      padding: 32px;
      background: #151515;
      border: 1px solid #303030;
      border-radius: 14px;
    }

    .logo {
      color: #ff3030;
      font-size: 23px;
      font-weight: 900;
      text-align: center;
    }

    h1 { text-align: center; font-size: 22px; }
    p { color: #aaa; text-align: center; font-size: 14px; }

    label {
      display: block;
      margin: 20px 0 8px;
    }

    input, button {
      width: 100%;
      padding: 13px;
      border-radius: 7px;
      font-size: 15px;
    }

    input {
      color: white;
      background: #0b0b0b;
      border: 1px solid #393939;
    }

    button {
      margin-top: 22px;
      border: 0;
      background: #e52929;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #mensagem { color: #ff6565; }
  </style>
</head>
<body>
  <main class="login">
    <div class="logo">BAD_DOS_TRENZINHOS</div>
    <h1>Painel administrativo</h1>
    <p>Acesso restrito ao administrador</p>

    <form id="loginForm">
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" autocomplete="username"
             required placeholder="Seu usuário">

      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password"
             autocomplete="current-password" required
             placeholder="Sua senha">

      <button type="submit">ENTRAR NO PAINEL</button>
      <p id="mensagem" role="status"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const mensagem = document.getElementById('mensagem');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      mensagem.textContent = 'Verificando acesso...';

      try {
        const resposta = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            usuario: document.getElementById('usuario').value,
            senha: document.getElementById('senha').value
          })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
          mensagem.textContent = dados.erro || 'Falha no login.';
          return;
        }

        window.location.href = '/painel.html';
      } catch {
        mensagem.textContent = 'Não foi possível conectar ao servidor.';
      }
    });
  </script>
</body>
</html>
